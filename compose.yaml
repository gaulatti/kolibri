# Local development only. This file is not a production deployment definition.
name: kolibri-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kolibri
      POSTGRES_USER: kolibri
      POSTGRES_PASSWORD: kolibri-local-development
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    command:
      - /bin/sh
      - -c
      - npm run migration:run && npm run start:dev
    environment:
      PORT: 3000
    ports:
      - "3188:3000"
    volumes:
      - generation-artifacts:/app/artifacts
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/nest-cli.json
        - action: rebuild
          path: ./backend/tsconfig.json
        - action: rebuild
          path: ./backend/tsconfig.build.json

  frontend:
    build:
      context: ./frontend
      target: development
    env_file:
      - path: ./frontend/.env.example
      - path: ./frontend/.env.local
        required: false
    ports:
      - "5188:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/react-router.config.ts
        - action: rebuild
          path: ./frontend/tsconfig.json
        - action: rebuild
          path: ./frontend/vite.config.ts

volumes:
  postgres-data:
  backend-data:
  generation-artifacts:
