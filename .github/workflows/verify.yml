name: Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to request a trusted PR-event reassessment
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kolibri-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-clouseau:
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
      digest: ${{ steps.engine.outputs.digest }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: engine
        uses: gaulatti/clouseau/scripts/resolve@f5b6f04a5b95090fc0b5dc0e6fec85cc426273f0
        with:
          provenance: summary

  verify:
    name: ${{ ((github.event_name == 'push' && !github.event.deleted) || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pull_request == '')) && 'verify' || 'metadata-only' }}
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request == '')
    needs: [resolve-clouseau]
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contract/package-lock.json
            .github/tests/package-lock.json
      - name: Install Clouseau wiring test dependencies
        run: npm --prefix .github/tests ci --ignore-scripts --no-audit --no-fund
      - name: Test Clouseau integration wiring
        run: npm --prefix .github/tests test
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install contract verification dependencies
        run: npm --prefix contract ci
      - name: Check backend and test types
        run: npm --prefix backend run test:types
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test backend with exact native coverage
        run: npm --prefix backend run test:cov
      - name: Check frontend types
        run: npm --prefix frontend run typecheck
      - name: Test frontend with exact native coverage
        run: npm --prefix frontend run test:coverage
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test contract with exact native coverage
        run: npm --prefix contract run test:coverage
      - name: Validate immutable contract release
        run: npm --prefix contract run validate
      - name: Verify contract build determinism
        run: npm --prefix contract run verify:determinism
      - name: Test conformance with exact native coverage
        run: npm --prefix conformance/bleecker-toggle run test:coverage
      - name: Verify black-box conformance
        run: npm --prefix conformance/bleecker-toggle run conform
      - name: Load released shared coverage engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - name: Verify this run frozen shared engine
        uses: ./.clouseau-ci
        with:
          operation: verify-engine
      - name: Validate released Clouseau interfaces
        run: npm --prefix .github/tests run verify:shared -- .clouseau-ci
      - name: Select accepted coverage recipe as data
        shell: bash
        env:
          ACCEPTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INITIAL_INSTALL_QUALIFICATION: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/ci/clouseau-supported-integration-20261024' && github.actor == 'gaulatti') ||
            (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gaulatti' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.body, 'clouseau-installation-review:v1')) }}
        run: |
          set -euo pipefail
          base="$ACCEPTED_BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse --verify 'origin/main^{commit}')"
          fi
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$base^{commit}"
          entry="$(git ls-tree "$base" -- .clouseau-local.json)"
          if [[ -n "$entry" ]]; then
            git show "$base:.clouseau-local.json" > "$RUNNER_TEMP/clouseau-coverage.json"
            message="Coverage recipe: immutable accepted base $base; proposed recipe changes cannot narrow this run's source inventory."
          else
            policy_entry="$(git ls-tree "$base" -- .github/clouseau.json)"
            test -z "$policy_entry"
            test "$INITIAL_INSTALL_QUALIFICATION" = true
            git show HEAD:.clouseau-local.json > "$RUNNER_TEMP/clouseau-coverage.json"
            message="INITIAL INSTALLATION QUALIFICATION ONLY: base $base has no recipe. Candidate data grants no review or trust authority; the separate signed initial trust checker is mandatory before installation acceptance."
          fi
          printf '%s\n' "$message"
          printf '%s\n\n' "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce 100% line and branch coverage
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kolibri-native-coverage.json"
          python3 .clouseau-ci/src/coverage_plan.py "$RUNNER_TEMP/clouseau-coverage.json" "$GITHUB_WORKSPACE" | tee "$report"
          {
            printf '### Complete application native coverage\n\n'
            printf 'Candidate: `%s`\n\n' "$(git rev-parse HEAD)"
            printf 'Shared Clouseau: `%s`\n\nEngine digest: `%s`\n\n' "$CLOUSEAU_ENGINE_SHA" "$CLOUSEAU_ENGINE_DIGEST"
            printf '```json\n'
            cat "$report"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  assess-intent:
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    needs: [resolve-clouseau]
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      assessment: ${{ steps.assess.outputs.assessment }}
      review-record: ${{ steps.assess.outputs.review-record }}
    steps:
      - name: Load accepted base configuration only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load this run frozen shared engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        id: assess
        with:
          operation: assess
          wait-for-verification: 'true'
          record-transport: job-output
          provider-key: ${{ secrets.DEEPSEEK_API_KEY }}
          typesafe-key: ${{ secrets.TYPESAFE_API_KEY }}

  approve-and-merge:
    name: ${{ (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) && 'approve-and-merge' || 'metadata-only-approval' }}
    if: always() && github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    needs: [resolve-clouseau, assess-intent]
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: kolibri-approval-${{ github.event.pull_request.number || inputs.pull_request || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Require a completed assessment
        if: >-
          needs.assess-intent.result != 'success'
        run: exit 1
      - name: Load accepted base configuration only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load this run frozen shared engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        with:
          operation: gate
          native-gate: 'true'
          assessment: ${{ needs.assess-intent.outputs.assessment }}
          record-transport: job-output
          review-record: ${{ needs.assess-intent.outputs.review-record }}

  request-reassessment:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve-intent ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request != '')
    needs: [resolve-clouseau]
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load this run frozen shared engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: ./.clouseau-ci
        with:
          operation: request-reassessment
          pull-request: ${{ inputs.pull_request }}
