name: Initial Clouseau trust verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: kolibri-initial-trust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-clouseau:
    if: contains(github.event.pull_request.body, 'clouseau-installation-review:v1')
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.engine.outputs.sha }}
      digest: ${{ steps.engine.outputs.digest }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: engine
        uses: gaulatti/clouseau/scripts/resolve@f5b6f04a5b95090fc0b5dc0e6fec85cc426273f0
        with:
          provenance: summary

  initial-trust:
    if: contains(github.event.pull_request.body, 'clouseau-installation-review:v1')
    needs: [resolve-clouseau]
    env:
      CLOUSEAU_ENGINE_SHA: ${{ needs.resolve-clouseau.outputs.sha }}
      CLOUSEAU_ENGINE_DIGEST: ${{ needs.resolve-clouseau.outputs.digest }}
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 70
    steps:
      - name: Load frozen released initial trust checker
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: ${{ needs.resolve-clouseau.outputs.sha || '0000000000000000000000000000000000000000' }}
          path: .clouseau-ci
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify this run frozen initial checker
        uses: ./.clouseau-ci
        with:
          operation: verify-engine
      - name: Verify initial trust and independent CI
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_REPOSITORY: ${{ github.repository }}
          INITIAL_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: >-
          node .clouseau-ci/bin/clouseau.cjs installation-check
          --repository "$INITIAL_REPOSITORY"
          --pull-request "$INITIAL_PULL_REQUEST"
