name: Deploy backend

# Kolibri's backend deploys the way Angelina and Pompeii do (gaulatti/kolibri#19): a Helix runner
# builds the image and pushes it to GHCR, then an ssh step on Helix pulls it, runs the migrations
# and starts the container on 127.0.0.1:3190 behind nginx. Its production settings come from its
# entry of the shared Secrets Manager envelope (SECRET_ARN and UNIQUE_KEY). No ECR, AWS key pair
# or CDK stack is needed.
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kolibri-backend-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, helix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOYMENT_TOKEN }}
      - name: Build Docker image
        run: docker build --target runtime -t ghcr.io/${{ github.repository }}:${{ github.sha }} ./backend
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, linux, x64, helix]
    needs: build
    steps:
      - name: Check the deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRET_ARN: ${{ secrets.SECRET_ARN }}
          UNIQUE_KEY: ${{ secrets.UNIQUE_KEY }}
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for name in AWS_REGION SECRET_ARN UNIQUE_KEY DEPLOYMENT_TOKEN DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing GitHub secret or variable:$missing"
            exit 1
          fi

      - name: Deploy to Helix
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRET_ARN: ${{ secrets.SECRET_ARN }}
          UNIQUE_KEY: ${{ secrets.UNIQUE_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF,AWS_REGION,SECRET_ARN,UNIQUE_KEY
          # Helix's login shell may be fish, so the script runs under sh explicitly. It must
          # contain no single quote.
          script: |
            sh -c '
            set -eu

            # Set inside sh: the login shell may be fish.
            AWS_CREDS="$HOME/.aws"

            PORT=3190
            NAME=kolibri-backend

            cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup EXIT

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Pull before stopping anything: the download is the slow part.
            docker pull "$IMAGE_REF"

            # The database and the production settings are reached from inside the container:
            # PostgreSQL through host.docker.internal, the settings through the shared envelope.
            COMMON="--add-host host.docker.internal:host-gateway -e NODE_ENV=production -e AWS_REGION=$AWS_REGION -e SECRET_ARN=$SECRET_ARN -e UNIQUE_KEY=$UNIQUE_KEY -v $AWS_CREDS:/home/node/.aws:ro"

            # Migrations first: a failed migration stops the deploy before the running backend is touched.
            docker run --rm $COMMON "$IMAGE_REF" npm run migration:run:prod

            docker stop "$NAME" || true
            docker rm "$NAME" || true

            docker run -d --name "$NAME" \
              -p 127.0.0.1:$PORT:$PORT \
              $COMMON \
              -e PORT=$PORT \
              --restart=always \
              --log-driver=local \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE_REF"

            # The image health check calls /health on $PORT.
            for attempt in $(seq 1 36); do
              status="$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}" "$NAME")"
              if [ "$status" = healthy ]; then
                echo "Kolibri backend healthy after $attempt checks"
                exit 0
              fi
              if [ "$status" = unhealthy ]; then
                break
              fi
              sleep 5
            done
            echo "Kolibri backend did not become healthy"
            docker logs --tail 100 "$NAME" || true
            exit 1
            '
