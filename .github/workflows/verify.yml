name: Verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kolibri-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: [self-hosted, linux, x64, helix, private, pool]
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contract/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install contract verification dependencies
        run: npm --prefix contract ci
      - name: Check backend and test types
        run: npm --prefix backend run test:types
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test backend with exact native coverage
        run: npm --prefix backend run test:cov
      - name: Check frontend types
        run: npm --prefix frontend run typecheck
      - name: Test frontend with exact native coverage
        run: npm --prefix frontend run test:coverage
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test contract with exact native coverage
        run: npm --prefix contract run test:coverage
      - name: Validate immutable contract release
        run: npm --prefix contract run validate
      - name: Verify contract build determinism
        run: npm --prefix contract run verify:determinism
      - name: Test conformance with exact native coverage
        run: npm --prefix conformance/bleecker-toggle run test:coverage
      - name: Verify black-box conformance
        run: npm --prefix conformance/bleecker-toggle run conform
      - name: Load released shared coverage engine
        uses: actions/checkout@v4
        with:
          repository: gaulatti/clouseau
          ref: c4e07381a288fc74200fd712f04ac3265ef2184a
          path: .clouseau-engine
          persist-credentials: false
      - name: Enforce 100% line and branch coverage
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kolibri-native-coverage.json"
          python3 .clouseau-engine/src/coverage_plan.py .clouseau-local.json "$GITHUB_WORKSPACE" | tee "$report"
          {
            printf '### Complete application native coverage\n\n'
            printf 'Candidate: `%s`\n\n' "$(git rev-parse HEAD)"
            printf 'Shared Clouseau: `c4e07381a288fc74200fd712f04ac3265ef2184a`\n\n'
            printf '```json\n'
            cat "$report"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
